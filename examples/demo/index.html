<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SlipKit Demo</title>
</head>
<body>
  <header>
    <span class="title">SlipKit Demo</span>
    <button id="mode-design" aria-pressed="true">Design template</button>
    <button id="mode-fill" aria-pressed="false">Fill voucher</button>
    <button id="mode-view" aria-pressed="false" hidden>View issued voucher</button>
    <button id="new-slip" hidden>New voucher</button>
    <span class="sep"></span>
    <button id="download">Download file</button>
    <button id="download-pdf">Download PDF</button>
    <button id="open">Open file</button>
    <span id="autosave" class="autosave"></span>
    <span id="status" class="status"></span>
  </header>

  <div class="notice">
    <span id="storage-notice"></span>
    <span id="storage-warning" class="warn"></span>
    <button id="clear-storage">Delete saved data</button>
  </div>

  <slip-designer id="designer"></slip-designer>
  <slip-form id="form" hidden></slip-form>
  <slip-viewer id="viewer" hidden></slip-viewer>

  <dialog id="filename-dialog">
    <form method="dialog">
      <h2>Download file</h2>
      <div class="body">
        <label for="filename">File name</label>
        <input id="filename" name="filename" autocomplete="off" />
      </div>
      <div class="foot">
        <button value="cancel">Cancel</button>
        <button value="ok">Download</button>
      </div>
    </form>
  </dialog>

  <dialog id="clear-dialog">
    <form method="dialog">
      <h2>Delete saved data?</h2>
      <div class="body">
        <p id="clear-body"></p>
      </div>
      <div class="foot">
        <button value="cancel">Cancel</button>
        <button value="ok" class="danger">Delete</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
